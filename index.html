        // ==================== QUẢN LÝ TRẠNG THÁI ỨNG DỤNG ====================
        let appData = {};
        let currentTab = 'tree';
        let selectedMemberId = null;
        let searchQuery = '';
        let filterGen = 'all';
        let treeZoom = 1;

        function initApp() {
            const savedVersion = localStorage.getItem(VERSION_STORAGE_KEY);
            let isVersionUpdated = false;

            if (savedVersion !== DATA_VERSION) {
                // Tự động xóa cache dữ liệu cũ của ứng dụng khi phiên bản thay đổi để nạp bản mới từ code
                localStorage.removeItem(DATA_STORAGE_KEY);
                localStorage.setItem(VERSION_STORAGE_KEY, DATA_VERSION);
                isVersionUpdated = true;
            }

            const saved = localStorage.getItem(DATA_STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = {
                        ...JSON.parse(JSON.stringify(DEFAULT_DATA)),
                        ...parsed,
                        tabs: (parsed.tabs && parsed.tabs.length === 4) ? parsed.tabs : JSON.parse(JSON.stringify(DEFAULT_DATA.tabs)),
                        coverConfig: {
                            ...DEFAULT_DATA.coverConfig,
                            ...(parsed.coverConfig || {}),
                            lines: (parsed.coverConfig && Array.isArray(parsed.coverConfig.lines)) ? parsed.coverConfig.lines : JSON.parse(JSON.stringify(DEFAULT_DATA.coverConfig.lines))
                        },
                        uiLabels: { ...DEFAULT_DATA.uiLabels, ...(parsed.uiLabels || {}) },
                        traditions: parsed.traditions || JSON.parse(JSON.stringify(DEFAULT_DATA.traditions))
                    };
                } catch (e) {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
            }

            if (appData.tabs && appData.tabs.length > 0) {
                currentTab = appData.tabs[0].id;
            }

            renderBottomNav();
            renderCurrentTab();

            if (isVersionUpdated) {
                showToast(`Đã cập nhật dữ liệu phiên bản ${DATA_VERSION}`);
            }
        }

        function saveData() {
            try {
                localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(appData));
                localStorage.setItem(VERSION_STORAGE_KEY, DATA_VERSION);
            } catch (e) {
                showToast('Bộ nhớ trình duyệt đầy!', true);
            }
        }

        // ==================== THANH ĐIỀU HƯỚNG DƯỚI ĐÁY ====================
        function renderBottomNav() {
            const nav = document.getElementById('bottom-nav');
            if (!nav || !appData.tabs) return;
            nav.innerHTML = `
                <div class="grid grid-cols-4 h-16">
                    ${appData.tabs.map(t => {
                        const isActive = currentTab === t.id;
                        return `
                            <button onclick="switchTab('${t.id}')" class="nav-btn flex flex-col items-center justify-center gap-1 px-1 transition relative ${isActive ? 'text-crimson-800 font-semibold' : 'text-stone-500 hover:text-amber-800 font-medium'}">
                                <i data-lucide="${t.icon}" class="w-5 h-5"></i>
                                <span class="text-[11px] truncate max-w-full">${t.label}</span>
                                <span class="nav-indicator ${isActive ? '' : 'hidden'} absolute top-0 w-8 h-0.5 bg-crimson-800 rounded-b-full"></span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderBottomNav();
            renderCurrentTab();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCurrentTab() {
            const main = document.getElementById('main-content');
            if (currentTab === 'tree') {
                main.innerHTML = renderTreeTab();
            } else if (currentTab === 'lineage') {
                main.innerHTML = renderHistoryTab();
            } else if (currentTab === 'events') {
                main.innerHTML = renderEventsTab();
            } else if (currentTab === 'archive') {
                main.innerHTML = renderGalleryTab();
            }
            lucide.createIcons();
        }

        // ==================== TAB 1: CÂY GIA PHẢ & ẢNH BÌA ====================
        function renderCoverLineHtml(line) {
            if (!line || !line.text || !line.text.trim()) return '';
            const safe = line.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            if (line.style === 'badge') {
                return `<div><span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] uppercase tracking-widest backdrop-blur-xs">${safe}</span></div>`;
            }
            if (line.style === 'title') {
                return `<h1 class="font-serif font-bold text-xl sm:text-2xl text-amber-100 drop-shadow-md tracking-wide">${safe}</h1>`;
            }
            if (line.style === 'subtitle') {
                return `<div class="text-xs font-medium text-amber-300/95 drop-shadow">${safe}</div>`;
            }
            if (line.style === 'motto') {
                return `<p class="font-serif italic text-xs text-amber-200/90 px-2 drop-shadow">${safe}</p>`;
            }
            return `<div class="text-xs text-amber-100/90">${safe}</div>`;
        }

        function renderTreeTab() {
            const maxGen = Math.max(...appData.members.map(m => Number(m.generation) || 1), 1);
            const totalMembers = appData.members.length;
            const branches = [...new Set(appData.members.map(m => m.branch).filter(Boolean))];
            const cc = appData.coverConfig;
            const ul = appData.uiLabels;

            const filteredMembers = appData.members.filter(m => {
                const q = searchQuery.toLowerCase();
                const matchSearch = !q ||
                    (m.name && m.name.toLowerCase().includes(q)) ||
                    (m.alias && m.alias.toLowerCase().includes(q)) ||
                    (m.hometown && m.hometown.toLowerCase().includes(q)) ||
                    (m.address && m.address.toLowerCase().includes(q)) ||
                    (m.spouse && m.spouse.toLowerCase().includes(q));
                const matchGen = filterGen === 'all' || String(m.generation) === String(filterGen);
                return matchSearch && matchGen;
            });

            const generations = {};
            filteredMembers.forEach(m => {
                const g = m.generation || 1;
                if (!generations[g]) generations[g] = [];
                generations[g].push(m);
            });
            const sortedGens = Object.keys(generations).sort((a, b) => Number(a) - Number(b));
            const hasLines = cc.lines && cc.lines.some(l => l.text && l.text.trim());

            return `
                <!-- Header Ảnh Bìa Dòng Họ -->
                <div class="relative">
                    <div class="min-h-[13.5rem] sm:min-h-[15.5rem] w-full overflow-hidden relative bg-cover-ornament flex flex-col justify-between">
                        ${cc.banner ? `
                            <img src="${cc.banner}" onerror="this.style.display='none'" alt="Ảnh bìa" class="absolute inset-0 w-full h-full object-cover opacity-85">
                            <div class="absolute inset-0 bg-gradient-to-t from-stone-950/90 via-stone-950/40 to-stone-950/25"></div>
                        ` : `
                            <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#fbbf24 1px, transparent 1px); background-size: 20px 20px;"></div>
                        `}
                        
                        <div class="relative z-10 p-3 flex items-center justify-between gap-2">
                            ${cc.yearBadge && cc.yearBadge.trim() ? `
                                <div class="bg-stone-950/60 backdrop-blur-xs text-amber-200/95 px-2.5 py-1 rounded-full text-[10px] border border-amber-400/25">
                                    ${cc.yearBadge}
                                </div>
                            ` : '<div></div>'}
                        </div>

                        <div class="relative z-10 px-4 pb-5 pt-6 text-center space-y-1.5">
                            ${hasLines ? cc.lines.map(line => renderCoverLineHtml(line)).join('') : '<div class="h-10"></div>'}
                        </div>
                    </div>

                    ${cc.showStats !== false ? `
                        <div class="px-4 -mt-3 relative z-10">
                            <div class="bg-white rounded-2xl shadow-md border border-amber-200/80 p-3 grid grid-cols-3 divide-x divide-amber-100 text-center">
                                <div>
                                    <div class="text-lg font-bold text-crimson-800">${maxGen}</div>
                                    <div class="text-[11px] text-stone-500 font-medium">${ul.statGenLabel}</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-amber-700">${totalMembers}</div>
                                    <div class="text-[11px] text-stone-500 font-medium">${ul.statMemberLabel}</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-heritage-800">${branches.length || 1}</div>
                                    <div class="text-[11px] text-stone-500 font-medium">${ul.statBranchLabel}</div>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>

                <!-- Thanh Tìm Kiếm & Bộ Lọc Đời -->
                <div class="px-4 pt-4 space-y-2.5">
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <i data-lucide="search" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                            <input type="text" value="${searchQuery}" oninput="handleSearch(this.value)" placeholder="Tìm tên, quê quán, vợ/chồng..." class="w-full pl-9 pr-8 py-2.5 bg-white rounded-xl border border-amber-200 text-sm focus:border-crimson-800 outline-none shadow-2xs">
                            ${searchQuery ? `<button onclick="handleSearch('')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600"><i data-lucide="x-circle" class="w-4 h-4"></i></button>` : ''}
                        </div>
                        <div class="flex items-center bg-white rounded-xl border border-amber-200 px-1 shadow-2xs">
                            <button onclick="changeZoom(-0.1)" class="p-2 text-stone-600 hover:text-crimson-800" title="Thu nhỏ"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
                            <span class="text-[11px] font-semibold text-stone-500 w-9 text-center">${Math.round(treeZoom * 100)}%</span>
                            <button onclick="changeZoom(0.1)" class="p-2 text-stone-600 hover:text-crimson-800" title="Phóng to"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                        <button onclick="setFilterGen('all')" class="px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${filterGen === 'all' ? 'bg-crimson-800 text-white shadow-xs' : 'bg-white text-stone-600 border border-amber-200'}">
                            Tất cả (${totalMembers})
                        </button>
                        ${Array.from({length: maxGen}, (_, i) => i + 1).map(g => `
                            <button onclick="setFilterGen('${g}')" class="px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${String(filterGen) === String(g) ? 'bg-crimson-800 text-white shadow-xs' : 'bg-white text-stone-600 border border-amber-200'}">
                                Đời ${g}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <!-- Sơ Đồ Cây Gia Phả Trực Quan -->
                <div class="px-3 pt-3 pb-6 overflow-x-auto">
                    <div id="tree-canvas" style="transform: scale(${treeZoom}); transform-origin: top center; transition: transform 0.2s ease;" class="space-y-6">
                        ${sortedGens.length === 0 ? `
                            <div class="text-center py-12 bg-white/80 rounded-2xl border border-dashed border-amber-300">
                                <i data-lucide="users" class="w-10 h-10 text-amber-400 mx-auto mb-2"></i>
                                <p class="text-sm text-stone-500">Không tìm thấy thành viên phù hợp.</p>
                            </div>
                        ` : sortedGens.map((gen, idx) => `
                            <div class="relative">
                                <div class="flex items-center justify-center mb-3">
                                    <div class="bg-gradient-to-r from-amber-100 via-amber-200 to-amber-100 border border-amber-400/60 px-4 py-1 rounded-full shadow-2xs flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-crimson-800"></span>
                                        <span class="font-serif font-bold text-xs text-crimson-950 uppercase tracking-wider">Đời Thứ ${gen}</span>
                                        <span class="text-[11px] text-amber-900 font-medium">(${generations[gen].length} người)</span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 gap-3">
                                    ${generations[gen].map(member => renderMemberCard(member)).join('')}
                                </div>

                                ${idx < sortedGens.length - 1 ? `
                                    <div class="flex flex-col items-center my-2">
                                        <div class="w-0.5 h-5 bg-gradient-to-b from-amber-500 to-crimson-700"></div>
                                        <i data-lucide="chevron-down" class="w-4 h-4 text-crimson-700 -mt-1.5"></i>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMemberCard(member) {
            const parent = appData.members.find(p => p.id === member.parentId);
            const isDeceased = member.status === 'deceased';
            const displayName = member.name && member.name.trim() ? member.name : 'Chưa rõ họ tên';
            const borderStyle = isDeceased
                ? 'border-stone-400 bg-stone-50/95'
                : (member.gender === 'male' ? 'border-amber-400/80 bg-white' : (member.gender === 'female' ? 'border-rose-300/80 bg-white' : 'border-amber-200 bg-white'));

            const genderBadge = member.gender === 'male'
                ? { icon: '♂', bg: 'bg-amber-700' }
                : (member.gender === 'female' ? { icon: '♀', bg: 'bg-rose-600' } : { icon: '•', bg: 'bg-stone-500' });

            return `
                <div onclick="openMemberDetail('${member.id}')" class="rounded-2xl border-2 ${borderStyle} p-3 shadow-sm hover:shadow-md active:scale-[0.99] transition cursor-pointer relative overflow-hidden">
                    ${isDeceased ? `
                        <div class="absolute top-0 right-0 bg-stone-600 text-stone-100 text-[9px] font-semibold px-2.5 py-0.5 rounded-bl-xl">
                            Tạ thế
                        </div>
                    ` : ''}

                    <div class="flex items-center gap-3">
                        <div class="relative shrink-0">
                            <img src="${member.avatar || 'https://placehold.co/150x150/f2dfc2/7c2d12?text=' + encodeURIComponent(displayName.charAt(0))}"
                                 onerror="this.src='https://placehold.co/150x150/f2dfc2/7c2d12?text=TV'"
                                 alt="${displayName}"
                                 class="w-14 h-14 rounded-full object-cover border-2 ${isDeceased ? 'border-stone-500 grayscale-[35%]' : (member.gender === 'male' ? 'border-amber-600' : 'border-rose-500')} shadow-xs">
                            <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold text-white shadow ${genderBadge.bg}">
                                ${genderBadge.icon}
                            </span>
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <h4 class="font-serif font-bold text-base text-stone-900 truncate">${displayName}</h4>
                                ${member.order ? `<span class="text-[10px] px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 font-semibold">${member.order}</span>` : ''}
                                ${member.relationType && member.relationType !== 'Gốc' ? `<span class="text-[10px] px-1.5 py-0.5 rounded-md bg-stone-100 text-stone-600 font-medium">${member.relationType}</span>` : ''}
                            </div>

                            ${member.alias ? `<p class="text-xs italic text-amber-800 truncate">${member.alias}</p>` : ''}

                            <div class="mt-1 space-y-0.5 text-xs text-stone-600">
                                ${parent ? `
                                    <div class="flex items-center gap-1 truncate">
                                        <i data-lucide="corner-down-right" class="w-3 h-3 text-amber-600 shrink-0"></i>
                                        <span>Con của: <b class="text-stone-800">${parent.name || 'Chưa rõ tên'}</b></span>
                                    </div>
                                ` : ''}
                                ${member.spouse ? `
                                    <div class="flex items-center gap-1 truncate">
                                        <i data-lucide="heart" class="w-3 h-3 text-rose-500 shrink-0"></i>
                                        <span>Phối ngẫu: ${member.spouse}</span>
                                    </div>
                                ` : ''}
                                ${member.hometown ? `
                                    <div class="flex items-center gap-1 truncate text-[11px] text-stone-500">
                                        <i data-lucide="map-pin" class="w-3 h-3 text-amber-700/70 shrink-0"></i>
                                        <span>Quê quán: ${member.hometown}</span>
                                    </div>
                                ` : ''}
                                ${(member.birth || (isDeceased && member.death)) ? `
                                    <div class="flex items-center gap-2 text-[11px] text-stone-500 pt-0.5 flex-wrap">
                                        ${member.birth ? `<span>Sinh: ${member.birth}</span>` : ''}
                                        ${isDeceased && member.death ? `<span>• Giỗ: <b class="text-crimson-800">${member.death}</b></span>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <i data-lucide="chevron-right" class="w-5 h-5 text-stone-400 shrink-0"></i>
                    </div>
                </div>
            `;
        }

        function handleSearch(val) {
            searchQuery = val;
            renderCurrentTab();
        }

        function setFilterGen(gen) {
            filterGen = gen;
            renderCurrentTab();
        }

        function changeZoom(delta) {
            treeZoom = Math.min(1.2, Math.max(0.7, +(treeZoom + delta).toFixed(1)));
            const canvas = document.getElementById('tree-canvas');
            if (canvas) canvas.style.transform = `scale(${treeZoom})`;
            renderCurrentTab();
        }

        // ==================== HỒ SƠ CHI TIẾT THÀNH VIÊN ====================
        function openMemberDetail(id) {
            selectedMemberId = id;
            const member = appData.members.find(m => m.id === id);
            if (!member) return;

            const parent = appData.members.find(p => p.id === member.parentId);
            const children = appData.members.filter(c => c.parentId === member.id);
            const isDeceased = member.status === 'deceased';
            const displayName = member.name && member.name.trim() ? member.name : 'Chưa rõ họ tên';

            const adminFields = [
                { label: 'Quê quán', val: member.hometown },
                { label: 'Dân tộc', val: member.ethnicity },
                { label: 'Tôn giáo', val: member.religion },
                { label: 'Nơi thường trú', val: member.address },
                { label: 'Nghề nghiệp / Học vấn', val: member.job },
                { label: 'Số điện thoại / Liên hệ', val: member.phone }
            ].filter(item => item.val && item.val.trim() !== '');

            const statusText = member.status === 'deceased' ? 'Đã tạ thế' : (member.status === 'alive' ? 'Còn sống' : 'Không rõ');

            const content = document.getElementById('member-detail-content');
            content.innerHTML = `
                <div class="flex flex-col items-center text-center bg-white p-5 rounded-2xl border border-amber-200/80 shadow-2xs relative">
                    <img src="${member.avatar || 'https://placehold.co/200x200/f2dfc2/7c2d12?text=' + encodeURIComponent(displayName.charAt(0))}"
                         onerror="this.src='https://placehold.co/200x200/f2dfc2/7c2d12?text=TV'"
                         class="w-28 h-28 rounded-full object-cover border-4 ${isDeceased ? 'border-stone-500' : 'border-amber-500'} shadow-md">
                    <h2 class="font-serif font-bold text-xl text-stone-900 mt-3">${displayName}</h2>
                    ${member.alias ? `<p class="text-sm italic text-amber-800 font-medium">${member.alias}</p>` : ''}
                    <div class="flex items-center gap-1.5 mt-2.5 flex-wrap justify-center">
                        ${member.generation ? `<span class="px-3 py-1 rounded-full bg-crimson-900 text-amber-100 text-xs font-semibold">Đời thứ ${member.generation}</span>` : ''}
                        ${member.branch ? `<span class="px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-semibold">${member.branch}</span>` : ''}
                        ${member.order ? `<span class="px-3 py-1 rounded-full bg-stone-100 text-stone-700 text-xs font-semibold">${member.order}</span>` : ''}
                        ${member.relationType && member.relationType !== 'Gốc' ? `<span class="px-3 py-1 rounded-full bg-sky-50 text-sky-800 border border-sky-200 text-xs font-semibold">${member.relationType}</span>` : ''}
                    </div>
                </div>

                ${adminFields.length > 0 ? `
                    <div class="bg-white p-4 rounded-2xl border border-amber-200/80 space-y-2.5 text-sm">
                        <h4 class="font-serif font-bold text-crimson-900 flex items-center gap-2 border-b border-amber-100 pb-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Thông Tin Hành Chính & Căn Cước
                        </h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${adminFields.map(f => `
                                <div class="${(f.label === 'Nơi khai sinh' || f.label === 'Quê quán' || f.label === 'Nơi thường trú') ? 'sm:col-span-2' : ''} bg-heritage-50/70 px-3 py-2 rounded-xl border border-amber-100/80">
                                    <span class="text-[11px] text-stone-400 block">${f.label}</span>
                                    <span class="font-semibold text-stone-800">${f.val}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="bg-white p-4 rounded-2xl border border-amber-200/80 space-y-2.5 text-sm">
                    <h4 class="font-serif font-bold text-crimson-900 flex items-center gap-2 border-b border-amber-100 pb-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-amber-600"></i> Mốc Thời Gian & Phối Ngẫu
                    </h4>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <span class="text-[11px] text-stone-400 block">Ngày tháng năm sinh</span>
                            <span class="font-semibold text-stone-800">${member.birth || 'Chưa có thông tin'}</span>
                        </div>
                        <div>
                            <span class="text-[11px] text-stone-400 block">Tình trạng</span>
                            <span class="font-semibold ${isDeceased ? 'text-stone-600' : (member.status === 'alive' ? 'text-emerald-700' : 'text-stone-500')}">
                                ${statusText}
                            </span>
                        </div>
                    </div>

                    ${isDeceased && (member.deathDate || member.death || member.burial || member.burialMap) ? `
                        <div class="bg-stone-100 p-3 rounded-xl space-y-2 border border-stone-200/80">
                            <div class="grid grid-cols-2 gap-2">
                                ${member.deathDate ? `
                                    <div>
                                        <span class="text-[11px] text-stone-500 block">Ngày tháng năm mất</span>
                                        <span class="font-semibold text-stone-800">${member.deathDate}</span>
                                    </div>
                                ` : ''}
                                ${member.death ? `
                                    <div>
                                        <span class="text-[11px] text-stone-500 block">Ngày giỗ (Âm lịch)</span>
                                        <span class="font-bold text-crimson-800">${member.death}</span>
                                    </div>
                                ` : ''}
                            </div>
                            ${member.burial ? `
                                <div>
                                    <span class="text-[11px] text-stone-500 block">Nơi an táng / Phần mộ</span>
                                    <span class="font-medium text-stone-800">${member.burial}</span>
                                </div>
                            ` : ''}
                            ${member.burialMap ? `
                                <a href="${member.burialMap}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-semibold text-crimson-800 bg-white px-3 py-1.5 rounded-lg border border-amber-300 shadow-2xs hover:bg-amber-50">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Xem vị trí phần mộ trên bản đồ
                                </a>
                            ` : ''}
                        </div>
                    ` : ''}

                    ${member.spouse ? `
                        <div class="pt-1 border-t border-stone-100">
                            <span class="text-[11px] text-stone-400 block">Vợ / Chồng (Phối ngẫu)</span>
                            <span class="font-semibold text-stone-800">${member.spouse}</span>
                        </div>
                    ` : ''}
                </div>

                <div class="bg-white p-4 rounded-2xl border border-amber-200/80 space-y-3 text-sm">
                    <h4 class="font-serif font-bold text-crimson-900 flex items-center gap-2 border-b border-amber-100 pb-2">
                        <i data-lucide="network" class="w-4 h-4 text-amber-600"></i> Quan Hệ Huyết Thống
                    </h4>
                    <div>
                        <span class="text-[11px] text-stone-400 block mb-1">Thân phụ / Thân mẫu</span>
                        ${parent ? `
                            <button onclick="openMemberDetail('${parent.id}')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-heritage-50 hover:bg-amber-100/70 border border-amber-200 transition text-left">
                                <div class="flex items-center gap-2.5">
                                    <img src="${parent.avatar}" onerror="this.src='https://placehold.co/100x100/f2dfc2/7c2d12?text=TV'" class="w-8 h-8 rounded-full object-cover">
                                    <div>
                                        <div class="font-semibold text-stone-900">${parent.name || 'Chưa rõ tên'}</div>
                                        <div class="text-[11px] text-stone-500">Đời thứ ${parent.generation}</div>
                                    </div>
                                </div>
                                <i data-lucide="arrow-up-right" class="w-4 h-4 text-amber-700"></i>
                            </button>
                        ` : `<span class="text-stone-500 italic text-xs">Là Thủy tổ / Chưa liên kết đời trên</span>`}
                    </div>

                    <div>
                        <span class="text-[11px] text-stone-400 block mb-1">Các con (${children.length})</span>
                        ${children.length > 0 ? `
                            <div class="space-y-1.5">
                                ${children.map(c => `
                                    <button onclick="openMemberDetail('${c.id}')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-heritage-50 hover:bg-amber-100/70 border border-amber-200 transition text-left">
                                        <div class="flex items-center gap-2.5">
                                            <img src="${c.avatar}" onerror="this.src='https://placehold.co/100x100/f2dfc2/7c2d12?text=TV'" class="w-8 h-8 rounded-full object-cover">
                                            <div>
                                                <div class="font-semibold text-stone-900">${c.name || 'Chưa rõ tên'}</div>
                                                <div class="text-[11px] text-stone-500">${c.order || 'Con'} • Đời ${c.generation}</div>
                                            </div>
                                        </div>
                                        <i data-lucide="chevron-right" class="w-4 h-4 text-amber-700"></i>
                                    </button>
                                `).join('')}
                            </div>
                        ` : `<span class="text-stone-500 italic text-xs">Chưa có thông tin con cái</span>`}
                    </div>
                </div>

                ${member.bio && member.bio.trim() ? `
                    <div class="bg-white p-4 rounded-2xl border border-amber-200/80 space-y-2 text-sm">
                        <h4 class="font-serif font-bold text-crimson-900 flex items-center gap-2 border-b border-amber-100 pb-2">
                            <i data-lucide="book-open" class="w-4 h-4 text-amber-600"></i> Tiểu Sử & Dấu Ấn
                        </h4>
                        <p class="text-stone-700 leading-relaxed whitespace-pre-line">${member.bio}</p>
                    </div>
                ` : ''}
            `;

            openModal('member-detail-modal');
            lucide.createIcons();
        }

        // ==================== TAB 2: LỊCH SỬ & TRUYỀN THỐNG DÒNG HỌ ====================
        function renderHistoryTab() {
            const ul = appData.uiLabels;
            return `
                <div class="p-4 space-y-4">
                    <div>
                        <h2 class="font-serif font-bold text-xl text-crimson-950">${ul.historyTabTitle}</h2>
                        <p class="text-xs text-stone-500">${ul.historyTabSubtitle}</p>
                    </div>

                    <div class="space-y-3.5">
                        ${appData.traditions.map((tr, index) => `
                            <div class="${index % 2 === 1 ? 'bg-gradient-to-br from-amber-50 to-orange-50/60 border-amber-300/80' : 'bg-white border-amber-200'} rounded-2xl p-4 border shadow-2xs space-y-2.5">
                                <div class="flex items-center gap-2 text-crimson-800 font-serif font-bold text-base border-b border-amber-200/60 pb-2">
                                    <div class="p-2 rounded-xl bg-amber-100 shrink-0">
                                        <i data-lucide="${tr.icon || 'scroll'}" class="w-4 h-4"></i>
                                    </div>
                                    <h3>${tr.title}</h3>
                                </div>
                                <p class="text-sm text-stone-700 leading-relaxed whitespace-pre-line">${tr.content}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ==================== TAB 3: LỊCH GIỖ CHẠP & TIN TỨC ====================
        function renderEventsTab() {
            const deceasedMembers = appData.members.filter(m => m.status === 'deceased' && (m.death || m.deathDate));
            const ul = appData.uiLabels;

            const typeBadge = {
                memorial: { label: 'Lịch Giỗ Tổ', color: 'bg-crimson-800 text-amber-100', icon: 'flame' },
                gathering: { label: 'Họp Họ', color: 'bg-amber-600 text-white', icon: 'users' },
                honor: { label: 'Vinh Danh / Khuyến Học', color: 'bg-emerald-700 text-white', icon: 'award' },
                news: { label: 'Tin Gia Tộc', color: 'bg-sky-700 text-white', icon: 'newspaper' }
            };

            return `
                <div class="p-4 space-y-5">
                    <div>
                        <h2 class="font-serif font-bold text-xl text-crimson-950">${ul.eventsTabTitle}</h2>
                        <p class="text-xs text-stone-500">${ul.eventsTabSubtitle}</p>
                    </div>

                    <div class="space-y-3">
                        ${appData.events.map(ev => {
                            const badge = typeBadge[ev.type] || typeBadge.gathering;
                            return `
                                <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-2xs space-y-2">
                                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${badge.color}">
                                        <i data-lucide="${badge.icon}" class="w-3 h-3"></i> ${badge.label}
                                    </span>
                                    <h4 class="font-serif font-bold text-base text-stone-900">${ev.title}</h4>
                                    <div class="text-xs font-semibold text-amber-800 flex items-center gap-1.5">
                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${ev.date}
                                    </div>
                                    <p class="text-sm text-stone-600 leading-relaxed whitespace-pre-line">${ev.desc}</p>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-2xs space-y-3">
                        <h3 class="font-serif font-bold text-base text-crimson-900 flex items-center gap-2 border-b border-amber-100 pb-2">
                            <i data-lucide="calendar-days" class="w-4 h-4 text-amber-600"></i>
                            Danh Sách Ngày Giỗ Trong Họ (${deceasedMembers.length})
                        </h3>
                        <div class="divide-y divide-stone-100">
                            ${deceasedMembers.map(m => `
                                <div onclick="openMemberDetail('${m.id}')" class="py-2.5 flex items-center justify-between cursor-pointer hover:bg-amber-50/60 px-2 rounded-xl transition gap-2">
                                    <div class="min-w-0">
                                        <div class="font-semibold text-sm text-stone-900 truncate">${m.name || 'Chưa rõ tên'} <span class="text-xs font-normal text-stone-500">(Đời ${m.generation})</span></div>
                                        <div class="text-xs text-stone-500 truncate">${m.burial || 'Phần mộ tại quê nhà'}</div>
                                    </div>
                                    <span class="text-xs font-bold text-crimson-800 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200/60 shrink-0">
                                        ${m.death || m.deathDate}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== TAB 4: THƯ VIỆN TƯ LIỆU & LIÊN HỆ ====================
        function renderGalleryTab() {
            const ul = appData.uiLabels;
            const catLabels = {
                photo: { name: 'Ảnh Kỷ Niệm', badge: 'bg-amber-100 text-amber-900' },
                document: { name: 'Tài Liệu Cổ', badge: 'bg-crimson-900 text-amber-100' },
                prayer: { name: 'Văn Khấn', badge: 'bg-emerald-100 text-emerald-900' }
            };

            return `
                <div class="p-4 space-y-5">
                    <div class="space-y-3">
                        <div>
                            <h2 class="font-serif font-bold text-xl text-crimson-950">${ul.galleryTabTitle}</h2>
                            <p class="text-xs text-stone-500">${ul.galleryTabSubtitle}</p>
                        </div>

                        <div class="grid grid-cols-1 gap-3.5">
                            ${appData.gallery.map(item => {
                                const cat = catLabels[item.category || 'photo'] || catLabels.photo;
                                return `
                                    <div class="bg-white rounded-2xl overflow-hidden border border-amber-200 shadow-2xs">
                                        ${item.url ? `<img src="${item.url}" onerror="this.style.display='none'" class="w-full h-48 object-cover">` : ''}
                                        <div class="p-4 space-y-2">
                                            <div class="flex items-center justify-between gap-2">
                                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${cat.badge}">${cat.name}</span>
                                                <span class="text-[11px] text-stone-400">${item.date || ''}</span>
                                            </div>
                                            <h4 class="font-serif font-bold text-base text-stone-900">${item.title}</h4>
                                            ${item.note ? `<p class="text-xs text-stone-700 leading-relaxed whitespace-pre-line bg-heritage-50 p-3 rounded-xl border border-amber-100">${item.note}</p>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-amber-50 to-heritage-100 rounded-2xl p-4 border border-amber-300/80 shadow-2xs space-y-2">
                        <div class="flex items-center gap-2 text-crimson-900 font-serif font-bold text-base">
                            <i data-lucide="phone-call" class="w-4 h-4 text-amber-700"></i>
                            <h3>${ul.adminContactTitle}</h3>
                        </div>
                        <div class="text-xs text-stone-700 leading-relaxed whitespace-pre-line">${ul.adminContactInfo}</div>
                    </div>

                    <div class="bg-heritage-100/70 rounded-2xl p-4 border border-amber-200/80 text-xs text-stone-600 space-y-1.5">
                        <div class="font-bold text-amber-950 flex items-center gap-1.5">
                            <i data-lucide="smartphone" class="w-4 h-4 text-crimson-800"></i> Mẹo sử dụng như App trên điện thoại:
                        </div>
                        <p>• <b>iPhone (Safari):</b> Bấm nút <b>Chia sẻ (Share)</b> ở dưới cùng → Chọn <b>Thêm vào MH chính (Add to Home Screen)</b>.</p>
                        <p>• <b>Android (Chrome):</b> Bấm dấu <b>3 chấm</b> góc trên → Chọn <b>Cài đặt ứng dụng / Thêm vào màn hình chính</b>.</p>
                    </div>
                </div>
            `;
        }

        // ==================== TIỆN ÍCH MODAL & TOAST ====================
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = msg;
            toast.classList.remove('hidden', 'bg-stone-900/95', 'bg-red-900/95');
            toast.classList.add(isError ? 'bg-red-900/95' : 'bg-stone-900/95');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
